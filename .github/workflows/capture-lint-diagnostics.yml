name: Capture lint diagnostics

on:
  push:
    branches:
      - migration/next-app-router
    paths:
      - .github/workflows/capture-lint-diagnostics.yml

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Capture ESLint output
        shell: bash
        run: |
          set +e
          FORCE_COLOR=0 yarn lint > docs/progress/eslint-diagnostics.txt 2>&1
          status=$?
          echo "" >> docs/progress/eslint-diagnostics.txt
          echo "exit_code=$status" >> docs/progress/eslint-diagnostics.txt
          exit 0

      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/progress/eslint-diagnostics.txt
          git commit -m "chore(ci): capture ESLint diagnostics"
          git push origin "HEAD:${GITHUB_REF_NAME}"
