name: Update Next migration lockfile

on:
  push:
    branches:
      - migration/next-app-router
    paths:
      - package.json
      - .github/workflows/update-next-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Refresh Yarn lockfile
        run: yarn install --ignore-scripts

      - name: Commit lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- yarn.lock; then
            echo "yarn.lock is already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yarn.lock
          git commit -m "chore(deps): refresh yarn lockfile for Next.js"
          git push origin "HEAD:${GITHUB_REF_NAME}"
