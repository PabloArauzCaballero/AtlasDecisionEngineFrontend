name: Split global CSS by responsibility

on:
  push:
    branches:
      - migration/next-app-router
    paths:
      - .github/workflows/split-global-css.yml

permissions:
  contents: write

jobs:
  split:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Split the verified legacy stylesheet
        shell: python
        run: |
          from pathlib import Path

          source_path = Path('src/styles/global.css')
          lines = source_path.read_text(encoding='utf-8').splitlines(keepends=True)
          if len(lines) != 1964:
              raise SystemExit(f'Expected 1964 CSS lines before split, found {len(lines)}')

          sections = [
              ('foundation.css', 1, 257),
              ('controls.css', 258, 414),
              ('data-display.css', 415, 600),
              ('metrics.css', 601, 654),
              ('auth-feedback.css', 655, 904),
              ('corporate.css', 905, 1147),
              ('graph-shell.css', 1148, 1337),
              ('graph-canvas.css', 1338, 1452),
              ('quality.css', 1453, 1642),
              ('operations-governance.css', 1643, 1904),
              ('responsive.css', 1905, 1964),
          ]

          output_dir = Path('src/styles/parts')
          output_dir.mkdir(parents=True, exist_ok=True)
          imports = []

          for name, start, end in sections:
              content = ''.join(lines[start - 1:end])
              line_count = len(content.splitlines())
              if line_count >= 300:
                  raise SystemExit(f'{name} exceeds the 299-line limit: {line_count}')
              (output_dir / name).write_text(content, encoding='utf-8')
              imports.append(f"@import './parts/{name}';\n")

          source_path.write_text(''.join(imports), encoding='utf-8')

      - name: Commit stylesheet modules
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles
          git commit -m "refactor(styles): split global CSS by responsibility"
          git push origin "HEAD:${GITHUB_REF_NAME}"
