name: Verify Next migration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - migration/next-app-router
    paths-ignore:
      - docs/**

permissions:
  contents: write

jobs:
  format-fix:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/next-app-router

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies from lockfile
        run: yarn install --frozen-lockfile

      - name: Format affected CSS files
        run: >-
          yarn prettier --write
          src/styles/parts/auth-feedback.css
          src/styles/parts/corporate.css
          src/styles/parts/data-display.css
          src/styles/parts/graph-canvas.css
          src/styles/parts/metrics.css
          src/styles/parts/operations-governance.css
          src/styles/parts/quality.css

      - name: Commit formatting changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes were required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/styles/parts/auth-feedback.css \
            src/styles/parts/corporate.css \
            src/styles/parts/data-display.css \
            src/styles/parts/graph-canvas.css \
            src/styles/parts/metrics.css \
            src/styles/parts/operations-governance.css \
            src/styles/parts/quality.css
          git commit -m "style: format split CSS files"
          git push origin HEAD:migration/next-app-router

  format-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies from lockfile
        run: yarn install --frozen-lockfile

      - name: Capture files that need formatting
        shell: bash
        run: yarn prettier --list-different . > prettier-differences.txt || true

      - name: Upload formatting diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: prettier-differences
          path: prettier-differences.txt
          if-no-files-found: error
          retention-days: 1

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies from lockfile
        run: yarn install --frozen-lockfile

      - name: Verify formatting
        run: yarn format:check

      - name: Run ESLint
        run: yarn lint

      - name: Verify source architecture and route inventory
        run: yarn verify:source

      - name: Run TypeScript checks
        run: yarn typecheck

      - name: Run unit tests
        run: yarn test

      - name: Build Next.js production bundle
        env:
          DECISION_ENGINE_URL: http://127.0.0.1:3000
          NEXT_TELEMETRY_DISABLED: 1
        run: yarn build
