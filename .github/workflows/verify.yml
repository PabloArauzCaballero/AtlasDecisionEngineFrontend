name: Verify

on:
  pull_request:
    branches:
      - main
      - dev
      - test
  push:
    # `dev` es donde se integra y lo que Coolify despliega. Con sólo `main`, este workflow no
    # corría desde el 2026-08-05: el portal se desplegaba sin format, lint, pruebas, e2e ni
    # auditoría de dependencias (y así llegaron a producción dos avisos críticos de Next).
    branches:
      - main
      - dev
      - test
    paths-ignore:
      - docs/**

permissions:
  contents: read

# Una corrida por rama. En pull_request la nueva cancela la anterior; en push a dev/test NO: esa
# corrida es la evidencia del SHA promovido y cancelarla deja al commit sin veredicto (medido en el
# portal el 2026-09-28: tres «cancelled» seguidos).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lo que se puede comprobar sin navegador. Va primero porque es lo barato: si
  # el formato o los tipos no cuadran, no merece la pena levantar Chromium.
  static:
    name: Formato, tipos y pruebas unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies from lockfile
        run: yarn install --frozen-lockfile

      - name: Test published smoke contract
        run: |
          node --test .github/tests/post-deploy-smoke.test.mjs
          node --test .github/tests/audit-high.test.mjs

      - name: Verify formatting
        run: yarn format:check

      - name: Run ESLint
        run: yarn lint

      - name: Verify source conventions, routes and design tokens
        run: yarn verify:source

      - name: Run TypeScript checks
        run: yarn typecheck

      - name: Run unit tests and enforce coverage floor
        run: yarn test:coverage

      - name: Build Next.js production bundle
        env:
          DECISION_ENGINE_URL: http://127.0.0.1:3000
          NEXT_TELEMETRY_DISABLED: 1
        run: yarn build

  # Lo que sólo se ve en un navegador de verdad: errores en tiempo de ejecución,
  # contraste efectivo sobre el DOM pintado y foco de los diálogos. Sin este
  # trabajo, todas esas comprobaciones dependen de que alguien las recuerde, y un
  # guardarraíl que hay que recordar es una sugerencia.
  browser:
    name: Pruebas en navegador (build de producción)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies from lockfile
        run: yarn install --frozen-lockfile

      # Sólo Chromium: es el único proyecto declarado en la configuración, y
      # bajarse los tres navegadores triplicaría el tiempo para nada.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Los intérpretes del cuaderno de datos (Pyodide y WebR) son artefactos reproducibles que
      # no se versionan (`.gitignore`) y se sirven desde `/pyodide/` y `/webr/` del propio origen.
      # Sin este paso el build sale sin ellos y TODAS las pruebas de celdas de Python y R fallan
      # en CI con «No se encontró el intérprete en /pyodide/», sin que el cuaderno esté roto.
      # Va ANTES del build: `public/` se copia al artefacto al compilar.
      - name: Install notebook interpreters (Pyodide, WebR)
        run: yarn setup:interpretes

      - name: Build Next.js production bundle
        env:
          DECISION_ENGINE_URL: http://127.0.0.1:3000
          NEXT_TELEMETRY_DISABLED: 1
        run: yarn build

      # Contra el artefacto que se despliega, no contra el servidor de
      # desarrollo: sin compilación al vuelo, un fallo significa siempre un
      # defecto y nunca "hoy la máquina iba lenta".
      - name: Run end-to-end suite
        env:
          DECISION_ENGINE_URL: http://127.0.0.1:3000
          NEXT_TELEMETRY_DISABLED: 1
        run: yarn test:e2e:prod

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  # Seguridad de la cadena de suministro.
  #
  # No existía, y por eso el portal llegó a acumular 31 avisos de severidad alta
  # —once de ellos en `next`, incluidos SSRF y saltos de middleware— sin que
  # ninguna corrida se pusiera roja. Un aviso que hay que acordarse de consultar
  # no es un control; es una sugerencia.
  #
  # Va en trabajo aparte y no dentro de `static` para que un fallo diga qué se
  # rompió sin tener que leer el registro: «tipos» y «dependencia vulnerable» se
  # arreglan en sitios distintos y a veces por personas distintas.
  supply-chain:
    name: Dependencias, secretos e inventario (SBOM)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        # Historia completa: sin ella el escaneo de secretos sólo ve el último
        # commit, y una credencial se filtra en el commit que la introdujo, no
        # en el que la borra.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies from lockfile
        run: yarn install --frozen-lockfile

      # Bloquea por avisos ALTOS en lo que se despliega.
      #
      # `--groups dependencies` deja fuera las herramientas de desarrollo a
      # propósito, y no para bajar el listón: los avisos que quedan hoy en
      # `eslint`, `typescript-eslint` y `vitest` son denegaciones de servicio en
      # procesos que sólo corren aquí, sobre entrada nuestra, y no llegan al
      # navegador de nadie. Bloquear por ellos obligaría a fijar versiones
      # transitivas de terceros cada semana, y una puerta que hay que sortear a
      # mano cada semana acaba desactivada — que es como se llega a acumular
      # once CVE altos en `next` sin que nadie se entere.
      #
      # Los once de `next` SÍ eran de producción: esta puerta los habría parado.
      # `yarn audit --level high` NO hace lo que su nombre promete: en yarn 1 `--level` filtra
      # lo que se IMPRIME, y el codigo de salida es un mapa de bits con TODAS las severidades
      # (1 info · 2 low · 4 moderate · 8 high · 16 critical). Con cero avisos altos y cuatro
      # bajos/moderados salia con 6, asi que este trabajo llevaba rojo por avisos que el
      # comentario de abajo dice explicitamente NO bloquear — y una puerta siempre roja se
      # ignora, que es como se acumulan once CVE altos en `next` sin que nadie se entere.
      - name: Audit runtime dependencies
        run: yarn security:audit

      # El resto se informa entero, incluidas las de desarrollo y las moderadas.
      # `|| true` porque `yarn audit` sale con código distinto de cero en cuanto
      # encuentra algo, y aquí el objetivo es dejar el inventario en el registro.
      - name: Report every advisory (no bloquea)
        if: always()
        run: yarn audit || true

      # Inventario de software: hace falta para atestar la procedencia del
      # artefacto (NIST SSDF, y EO 14028 para cualquier comprador federal).
      - name: Generate SBOM (CycloneDX)
        # `--ignore-npm-errors`: el inventario se lee con `npm ls`, que da por «inválidas» las
        # versiones que `resolutions` de yarn fija a propósito por seguridad (dompurify, postcss,
        # brace-expansion) y abortaba con ELSPROBLEMS sin generar nada. El árbol instalado es el
        # que se despliega, así que es el que el SBOM tiene que describir.
        run: npx --yes @cyclonedx/cyclonedx-npm@latest --ignore-npm-errors --output-file sbom.json --output-format JSON

      - name: Publish SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.json
          retention-days: 90

      - name: Scan history for leaked secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Análisis estático de seguridad del código propio, que es lo que `yarn audit`
  # no mira: el audit sólo sabe de dependencias publicadas.
  codeql:
    name: Análisis estático de seguridad (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialise CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyse
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

  # Escaneo de secretos (auditoría a producción, 2026-09-13). Este repositorio es PÚBLICO: lo que
  # entra en un commit queda indexado aunque se borre después. Corre antes de instalar
  # dependencias, así que sólo mira código de Atlas. Alcance (auditoría de seguridad 2026-10-09):
  # el HISTORIAL COMPLETO (`fetch-depth: 0` + modo `git`), no sólo el árbol; antes una credencial
  # commiteada y borrada después no se detectaba nunca. Las excepciones viven en la propia línea
  # (`// gitleaks:allow`); los hallazgos ya revisados del historial, por fingerprint en
  # .gitleaksignore. .gitleaks.toml explica por qué no hay excepciones por ruta.
  secret-scan:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Instalar gitleaks 8.30.1 (versión y checksum fijados)
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks && sudo install gitleaks /usr/local/bin/gitleaks && rm gitleaks gitleaks.tar.gz
      - name: Escanear todo el historial
        run: gitleaks git . --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore --redact --exit-code 1

  # ÚNICO trabajo que se exige como check requerido en dev/test/main. Corre siempre y sólo es verde
  # si TODOS los trabajos obligatorios lo son: `skipped` o `cancelled` en cualquiera es rojo aquí.
  release-gate:
    name: release-gate
    if: always()
    needs: [static, browser, supply-chain, codeql, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Todos los trabajos obligatorios en success
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'
          if echo "$RESULTS" | jq -e '[.[] | .result] | all(. == "success")' >/dev/null; then
            echo "release-gate: success"
          else
            echo "::error::Algún trabajo obligatorio no terminó en success"; exit 1
          fi

  deploy-dev:
    name: Desplegar DEV sólo después de los quality gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [release-gate]
    uses: ./.github/workflows/deploy-dev.yml
    secrets: inherit
