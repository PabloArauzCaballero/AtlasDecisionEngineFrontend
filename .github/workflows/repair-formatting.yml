name: Repair formatting

on:
  push:
    branches:
      - migration/next-app-router

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/next-app-router

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies from lockfile
        run: yarn install --frozen-lockfile

      - name: Repair CSS split boundary
        shell: python
        run: |
          from pathlib import Path

          foundation_path = Path('src/styles/parts/foundation.css')
          controls_path = Path('src/styles/parts/controls.css')

          foundation = foundation_path.read_text(encoding='utf-8')
          controls = controls_path.read_text(encoding='utf-8')

          broken_foundation_suffix = '.page-header {\n  display: flex;\n'
          broken_controls_prefix = (
              '  justify-content: space-between;\n'
              '  gap: 30px;\n'
              '  align-items: flex-start;\n'
              '  margin-bottom: 24px;\n'
              '}\n'
          )

          if not foundation.endswith(broken_foundation_suffix):
              raise SystemExit('foundation.css no contiene el corte esperado de .page-header')
          if not controls.startswith(broken_controls_prefix):
              raise SystemExit('controls.css no contiene el corte esperado de .page-header')

          foundation_path.write_text(
              foundation.removesuffix(broken_foundation_suffix),
              encoding='utf-8',
          )
          controls_path.write_text(
              '.page-header {\n'
              '  display: flex;\n'
              + controls,
              encoding='utf-8',
          )

      - name: Format repository
        run: yarn format

      - name: Verify formatting
        run: yarn format:check

      - name: Commit repaired formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes were required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix(styles): repair CSS split and format migration"
          git push origin HEAD:migration/next-app-router
