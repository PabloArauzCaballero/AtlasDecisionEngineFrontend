name: atlas-decision-frontend

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: atlas-decision-frontend:3.0.0
    # 5173 es el puerto del servidor de desarrollo (`yarn dev`). Publicar aquí el
    # contenedor en el mismo número obligaba a adivinar cuál de los dos estabas
    # mirando —y el navegador servía la versión cacheada del otro—. El contenedor
    # vive en 5180 para que ambos puedan convivir sin ambigüedad.
    ports:
      - '${FRONTEND_PORT:-5180}:3000'
    environment:
      # `api` es el nombre del servicio del motor DENTRO de su propia red de
      # Compose (proyecto `atlas-decision-engine`), a la que este contenedor se
      # engancha abajo. No se usa `host.docker.internal` porque el motor publica
      # su puerto solo en 127.0.0.1 del anfitrión: alcanzable desde el navegador,
      # pero no desde otro contenedor. Contenedor a contenedor no depende de
      # ninguna publicación de puertos.
      #
      # La variable de override se llama distinto A PROPÓSITO. Con
      # `${DECISION_ENGINE_URL:-…}`, el `.env` del repositorio —que existe para el
      # servidor de desarrollo del anfitrión, donde `api` no resuelve— se colaba
      # dentro del contenedor y ganaba a este valor por omisión. El resultado era
      # un portal en Docker hablando con el motor por el puerto publicado del
      # anfitrión: funciona hasta que ese puerto deja de publicarse, y entonces
      # falla con 502 sin que nada en este archivo lo explique.
      DECISION_ENGINE_URL: ${FRONTEND_CONTAINER_ENGINE_URL:-http://api:3000}
      # Sólo `/pdf/generate` y `/pdf/preview` van aquí: son las únicas que
      # necesitan un navegador, y la imagen de la API del motor no lo lleva. El
      # resto de `/pdf/*` sigue yendo al motor, que es quien tiene la base.
      # Sin esta variable, imprimir falla contra el motor con un error explicado
      # en vez de desviarse en silencio a un servicio que quizá no exista.
      PDF_WORKER_URL: ${FRONTEND_CONTAINER_PDF_WORKER_URL:-http://pdf-worker:3100}
      # Clave de SERVICIO del generador documental, desde que dejó de aceptar peticiones
      # anónimas. Sin ella, el worker responde 401 al proxy y hasta ahora eso echaba a la
      # persona del portal: `authorizedFetch` lee cualquier 401 como «la sesión murió». Hoy el
      # proxy lo traduce a 502 y la sesión no se toca, pero sin la clave imprimir sigue sin
      # funcionar — que es un fallo honesto, no una expulsión.
      #
      # Debe coincidir con `PDF_SERVICE_API_KEY` del motor. Vacía sólo es válido si el worker
      # corre con `PDF_SERVICE_AUTH_ENABLED=false`.
      PDF_WORKER_SERVICE_KEY: ${PDF_WORKER_SERVICE_KEY:-}
      TRUSTED_PROXY: ${TRUSTED_PROXY:-false}
      DECISION_ENGINE_TIMEOUT_MS: ${DECISION_ENGINE_TIMEOUT_MS:-20000}
      # Sin valor, /metrics responde 404 y las métricas del motor no salen por
      # el portal. Es el valor por omisión a propósito: se raspa al motor.
      METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:-}
      NEXT_PUBLIC_ENVIRONMENT: ${NEXT_PUBLIC_ENVIRONMENT:-DEV}
    networks:
      - default
      - atlas-engine
    restart: unless-stopped

networks:
  # Red de aplicación que crea el compose del motor (`name: atlas-decision-engine`
  # → red `atlas-decision-engine_atlas_app`). Es EXTERNA a propósito: este
  # proyecto no la gestiona, solo se conecta. Hay que levantar el motor primero;
  # si no existe, Compose lo dice en vez de arrancar un frontend que no llega a
  # ningún sitio.
  #
  # NO es `_default`. El motor segmentó sus redes en `atlas_app` (API y worker) y
  # `atlas_data` (base y caché), y su red por omisión dejó de tener a nadie
  # dentro: el portal seguía enganchado a ella creyéndose conectado, `api` no
  # resolvía, y toda la interfaz respondía 502. `atlas_data` NO se toca —el
  # portal no habla con la base—.
  atlas-engine:
    external: true
    name: atlas-decision-engine_atlas_app
